<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Iniciar sesión - IZC MAYORISTA</title>
  <link rel="icon" href="assets/logo/iconoizc.png" type="image/png">
  <link rel="stylesheet" href="assets/css/index.css?v=29">
  <link rel="stylesheet" href="assets/css/auth.css?v=9">
  <script>
    if (location.protocol === 'file:') {
      location.replace('http://127.0.0.1:8080/login.html');
    }
  </script>
  <script src="assets/js/auth.js?v=30" defer></script>
  <script src="assets/js/index.js?v=3" defer></script>
</head>
<body>
  <div class="top-bar">
    <div class="top-bar-inner">
      <a href="https://api.whatsapp.com/send?phone=573144355391" target="_blank">Soporte Técnico</a>
    </div>
  </div>

  <header class="main-header">
    <div class="main-header-inner">
      <a class="logo" href="index.html">
        <img src="assets/logo/logoizc.png" alt="IZC Mayorista" class="logo-img">
      </a>
      <div style="flex:1"></div>
      <a href="favoritos.html" class="header-wishlist" id="headerWishlist" title="Mis favoritos" aria-label="Mis favoritos"><span class="header-wishlist-icon" aria-hidden="true">♥</span></a>
    </div>
  </header>

  <main class="auth-page">
    <div class="auth-card">
      <h1>Iniciar sesión</h1>
      <p class="auth-lead">Ingresa con tu NIT y contraseña.</p>
      <form id="loginForm" autocomplete="off">
        <div class="auth-field">
          <label for="loginNit">NIT</label>
          <input id="loginNit" name="nit" type="text" inputmode="numeric" placeholder="Ej: 900123456-1" required autocomplete="off" value="">
        </div>
        <div class="auth-field">
          <label for="loginPassword">Contraseña</label>
          <input id="loginPassword" name="password" type="password" placeholder="Tu contraseña" required minlength="4" autocomplete="new-password" value="">
        </div>
        <button class="auth-submit" type="submit">Entrar</button>
        <p id="authMessage" class="auth-message" role="status"></p>
      </form>
      <p class="auth-switch">¿No tienes cuenta? <a href="registro.html">Regístrate</a></p>
    </div>
  </main>
</body>
</html>
